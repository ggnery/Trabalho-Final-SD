# =============================================================================
# SalaViva — nginx como equivalente local do Application Load Balancer.
#
# O que este arquivo precisa reproduzir do ALB, e por quê:
#
#   1. Upgrade de HTTP/1.1 para WebSocket. É a razão de a arquitetura usar ALB
#      e não NLB/CLB: sem repassar os cabeçalhos Upgrade/Connection, o
#      handshake do /ws devolve 400 e não existe chat.
#   2. Timeout de leitura longo. Uma conexão de chat fica minutos ociosa entre
#      mensagens; com o padrão de 60 s o nginx a derrubaria e o cliente entraria
#      em um ciclo eterno de reconexão que pareceria "instabilidade do sistema".
#   3. Afinidade de sessão (ADR-007), aqui via ip_hash.
#   4. Remoção automática do nó doente do pool (max_fails/fail_timeout +
#      proxy_next_upstream) — o equivalente ao health check ativo do target
#      group, que é o que torna a demonstração de falha (EC3) automática.
# =============================================================================

worker_processes  auto;
error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    # Cada cliente de chat consome uma conexão do lado do cliente e uma do lado
    # do upstream durante toda a sessão WebSocket. O padrão (1024) esgotaria
    # rápido no teste de carga de 1.000 conexões.
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log com o upstream escolhido: durante a apresentação é a prova, em texto,
    # de que as conexões estão indo para nós distintos.
    log_format salaviva '$remote_addr -> $upstream_addr "$request" '
                        'status=$status tempo=${request_time}s '
                        'upgrade="$http_upgrade"';
    access_log /var/log/nginx/access.log salaviva;

    sendfile        on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Mapa exigido pelo upgrade de protocolo: quando o cliente pede "Upgrade",
    # repassamos "Connection: upgrade"; quando não pede, "Connection: close".
    # Passar "Connection: upgrade" fixo quebraria as requisições HTTP normais
    # (/, /metrics, /api/nodes) que compartilham este mesmo server block.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # -------------------------------------------------------------------------
    # Pool de nós — o "target group".
    #
    # least_conn, e NÃO ip_hash. A escolha é deliberada e foi corrigida depois
    # de medir:
    #
    #   Com ip_hash, todo tráfego vindo do host chega ao nginx com o mesmo IP de
    #   origem (o gateway da rede bridge do Docker). O algoritmo então concentra
    #   TODAS as conexões locais em um único nó. Medido em teste de carga: 273
    #   de 273 conexões caíram em node-b, com p95 de 25 s, enquanto os outros
    #   dois nós ficaram ociosos. Pior para a apresentação: três abas do
    #   navegador na mesma máquina mostrariam o mesmo node_id, e a evidência
    #   visual de distribuição — que é o ponto da demo — desapareceria.
    #
    # O sistema não precisa de afinidade para funcionar corretamente. Uma
    # conexão WebSocket, uma vez estabelecida, permanece no nó que a atendeu
    # até morrer; e ao reconectar, o cliente refaz `join` com o seu `last_seq`
    # e recupera o backlog em QUALQUER nó, porque o número de sequência vive no
    # Redis e o histórico no DynamoDB. A autenticação é stateless (JWT), então
    # também não prende a sessão a um nó. Ver ADR-007.
    #
    # least_conn distribui pela contagem de conexões ativas, que é a métrica
    # certa para conexões de longa duração: round-robin puro ignoraria o fato de
    # uma conexão de chat durar minutos e uma requisição HTTP durar milissegundos.
    #
    # max_fails=2 / fail_timeout=5s: após 2 falhas em 5 s o nó sai do pool por
    # 5 s. É o análogo do `unhealthy_threshold` do target group, e é o que torna
    # automática a recuperação na demonstração de falha (EC3).
    # -------------------------------------------------------------------------
    upstream salaviva_nodes {
        least_conn;

        server node-a:8000 max_fails=2 fail_timeout=5s;
        server node-b:8000 max_fails=2 fail_timeout=5s;
        server node-c:8000 max_fails=2 fail_timeout=5s;
    }

    server {
        listen      80;
        server_name _;

        # Health check do próprio balanceador. Responde sem tocar em upstream —
        # serve para distinguir "o nginx caiu" de "os nós caíram".
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "nginx ok\n";
        }

        location / {
            proxy_pass http://salaviva_nodes;

            # --- Upgrade para WebSocket --------------------------------------
            # HTTP/1.1 é obrigatório: o protocolo de upgrade não existe em 1.0,
            # e o nginx fala 1.0 com o upstream por padrão.
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # --- Identidade do cliente ---------------------------------------
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # --- Tempo real ---------------------------------------------------
            # Buffering desligado: com buffer, o nginx segura os frames até
            # encher o bloco e o chat ganha latência artificial de centenas de
            # milissegundos — o defeito mais comum de WebSocket atrás de proxy.
            proxy_buffering    off;
            proxy_request_buffering off;

            # 1 hora de ociosidade tolerada, folgadamente acima do heartbeat de
            # 20 s do servidor (SALAVIVA_HEARTBEAT_INTERVAL). O ALB usa
            # idle_timeout com o mesmo raciocínio.
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_connect_timeout 5s;

            # --- Failover ------------------------------------------------------
            # Se o nó escolhido morreu no meio do handshake, tenta o próximo em
            # vez de devolver 502 ao usuário. `non_idempotent` inclui o POST
            # /auth/login: reemitir um JWT não tem efeito colateral.
            proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;

            # Cabeçalho de diagnóstico: dá para ver no DevTools qual nó atendeu.
            # `always` porque a resposta 101 (Switching Protocols) do WebSocket
            # não é 2xx e seria ignorada sem ele.
            add_header X-Salaviva-Upstream $upstream_addr always;
        }
    }
}
